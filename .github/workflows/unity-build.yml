name: Unity Tests and Build - Hotelia

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  editmode-tests:
    name: Ejecutar pruebas EditMode
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restaurar cache de Unity para pruebas
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-EditMode-
            Library-${{ runner.os }}-
            Library-

      - name: Ejecutar pruebas EditMode
        id: editModeTests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: EditMode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hotelia EditMode Test Results
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Hotelia.Core

      - name: Guardar resultados EditMode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hotelia-EditMode-Test-Results
          path: ${{ steps.editModeTests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar reporte de cobertura EditMode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hotelia-EditMode-Coverage
          path: ${{ steps.editModeTests.outputs.coveragePath }}
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Compilar Hotelia para Windows
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # La compilación solo se ejecuta cuando EditMode aprueba.
    needs: editmode-tests

    steps:
      - name: Liberar espacio del runner
        shell: bash
        run: |
          echo "Espacio disponible antes de limpiar:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          docker system prune --all --force || true

          echo "Espacio disponible después de limpiar:"
          df -h

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # No se restaura Library aquí porque ocupa espacio
      # mientras Docker descarga la imagen de Unity para Windows.

      - name: Mostrar espacio antes de compilar
        shell: bash
        run: |
          echo "Espacio disponible antes de Unity Builder:"
          df -h

          echo "Tamaño del proyecto:"
          du -sh . || true

          echo "Tamaño de Library:"
          du -sh Library 2>/dev/null || true

      - name: Compilar Hotelia
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildName: Hotelia
          buildsPath: build

      - name: Mostrar espacio después de compilar
        if: always()
        shell: bash
        run: |
          echo "Espacio disponible después de Unity Builder:"
          df -h

          echo "Tamaño de la compilación:"
          du -sh build 2>/dev/null || true

      - name: Guardar build de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Hotelia-Windows
          path: build
          if-no-files-found: error
          retention-days: 14