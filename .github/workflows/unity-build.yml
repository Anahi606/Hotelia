name: Unity Tests and Build - Hotelia

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    name: Ejecutar pruebas EditMode y PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restaurar cache de Unity para pruebas
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-Tests-
            Library-${{ runner.os }}-
            Library-

      - name: Ejecutar pruebas automatizadas
        id: unityTests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: All
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Hotelia Unity Test Results

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hotelia-Test-Results
          path: ${{ steps.unityTests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Compilar Hotelia para Windows
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # La compilación solo inicia si las pruebas aprueban.
    needs: tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restaurar cache de Unity para Windows
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-Windows-
            Library-${{ runner.os }}-
            Library-

      - name: Compilar Hotelia
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildName: Hotelia
          buildsPath: build

      - name: Guardar build de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Hotelia-Windows
          path: build
          if-no-files-found: error
          retention-days: 14